name: Build & Publish Android APK + Auto-Update Manifest

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      requires_full_install:
        description: "Require full APK install for major structural update (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build Fresh APK & Sync Release Manifests
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Whether APK Needs Rebuild
        id: detect
        run: |
          CHANGED_IN_HEAD=$(git diff-tree --no-commit-id --name-only -r HEAD || true)
          LAST_APK_COMMIT=$(git log -n 1 --format=%H -- releases/kAM-Lite.apk || true)
          if [ -n "$LAST_APK_COMMIT" ]; then
            CHANGED_SINCE_APK=$(git diff --name-only "$LAST_APK_COMMIT"..HEAD || true)
          else
            CHANGED_SINCE_APK="$CHANGED_IN_HEAD"
          fi
          GRADLE_VER_CODE=$(grep -oP 'propVersionCode\s*=.*:\s*\K[0-9]+' app/build.gradle.kts || echo "15")
          MANIFEST_VER_CODE=$(grep -oP '"versionCode"\s*:\s*\K[0-9]+' releases/version.json 2>/dev/null || echo "0")
          echo "Changed in HEAD:"
          echo "$CHANGED_IN_HEAD"
          echo "Changed since last APK commit ($LAST_APK_COMMIT):"
          echo "$CHANGED_SINCE_APK"
          echo "Gradle versionCode=$GRADLE_VER_CODE vs Manifest versionCode=$MANIFEST_VER_CODE"
          if [ ! -f "releases/kAM-Lite.apk" ]; then
            echo "NEEDS_BUILD=true" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED_IN_HEAD" | grep -q "^releases/kAM-Lite\.apk$" && [ "$GRADLE_VER_CODE" = "$MANIFEST_VER_CODE" ]; then
            echo "NEEDS_BUILD=false" >> "$GITHUB_OUTPUT"
          elif [ "$GRADLE_VER_CODE" != "$MANIFEST_VER_CODE" ]; then
            echo "NEEDS_BUILD=true" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED_SINCE_APK" | grep -qE "^(app/|build\.gradle\.kts|settings\.gradle\.kts|gradle/)"; then
            echo "NEEDS_BUILD=true" >> "$GITHUB_OUTPUT"
          else
            echo "NEEDS_BUILD=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.detect.outputs.NEEDS_BUILD == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        if: steps.detect.outputs.NEEDS_BUILD == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Debug Keystore & Build Updated APK
        if: steps.detect.outputs.NEEDS_BUILD == 'true'
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          gradle :app:syncReleaseApk --no-daemon --stacktrace

      - name: Compute APK Fingerprint & Update Release Manifests
        env:
          REPO_SLUG: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          FORCE_FULL: ${{ github.event.inputs.requires_full_install || 'true' }}
        run: |
          mkdir -p releases
          VERSION_NAME=$(grep -oP 'propVersionName\s*=.*"\K[^"]+' app/build.gradle.kts || echo "1.15")
          VERSION_CODE=$(grep -oP 'propVersionCode\s*=.*:\s*\K[0-9]+' app/build.gradle.kts || echo "15")
          MIN_DELTA_BASE=$((VERSION_CODE - 3))
          if [ "$MIN_DELTA_BASE" -lt 1 ]; then
            MIN_DELTA_BASE=1
          fi

          APK_SHA256=""
          if [ -f "releases/kAM-Lite.apk" ]; then
            APK_SHA256=$(sha256sum releases/kAM-Lite.apk | awk '{print $1}')
          fi
          SHORT_SHA="${COMMIT_SHA:0:12}"
          NOW_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          SINGLE_AUTO_URL="https://github.com/${REPO_SLUG}/raw/${BRANCH_NAME}/releases/kAM-Lite.apk"
          DELTA_JSON_URL="https://raw.githubusercontent.com/${REPO_SLUG}/${BRANCH_NAME}/releases/delta-sync.json"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

          cat > releases/version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "minDeltaBaseVersionCode": ${MIN_DELTA_BASE},
            "maxDeltaGap": 3,
            "requiresFullInstall": ${FORCE_FULL},
            "commitSha": "${SHORT_SHA}",
            "apkSha256": "${APK_SHA256}",
            "updatedAt": "${NOW_ISO}",
            "apkDirectUrl": "${SINGLE_AUTO_URL}",
            "deltaSyncUrl": "${DELTA_JSON_URL}",
            "releaseNotesArabic": "الإصدار ${VERSION_NAME} (نجم الكارت v${VERSION_NAME}): تحديث تلقائي مباشر بأحدث بصمة للـ APK (${SHORT_SHA})."
          }
          EOF

          cat > releases/delta-sync.json <<EOF
          {
            "targetVersionCode": ${VERSION_CODE},
            "targetVersionName": "${VERSION_NAME}",
            "minCompatibleBaseVersion": ${MIN_DELTA_BASE},
            "commitSha": "${SHORT_SHA}",
            "apkSha256": "${APK_SHA256}",
            "updatedAt": "${NOW_ISO}",
            "deltaSummaryArabic": "تمت مزامنة أحدث نسخة من نجم الكارت v${VERSION_NAME} (${SHORT_SHA})",
            "latestApkDirectUrl": "${SINGLE_AUTO_URL}",
            "changedModules": [
              "home_double_tap_and_pull_to_refresh_cloud_sync",
              "student_attendance_indicator_lamp",
              "reports_multi_filters_and_period_summary",
              "custom_elder_card_settings_and_analytics",
              "differentiated_attendance_v3_chat_reports"
            ],
            "dynamicConfig": {
              "maxStudentsPerGroup": 150,
              "defaultLeaderboardMultiMonthEnabled": true,
              "enableGalleryPhotoDownload": true,
              "announcementBanner": ""
            }
          }
          EOF

          ls -lh releases/kAM-Lite.apk releases/version.json releases/delta-sync.json

      - name: Commit Updated APK & Manifests to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/kAM-Lite.apk releases/version.json releases/delta-sync.json
          git diff --staged --quiet || git commit -m "chore(release): publish APK v${VERSION_NAME} (${APK_SHA256:0:12}) [skip ci]"
          git push || true

      - name: Publish or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "نجم الكارت v${{ env.VERSION_NAME }} - أحدث نسخة للأندرويد (APK)"
          body: |
            ## 📲 تحميل تطبيق نجم الكارت v${{ env.VERSION_NAME }} للأندرويد
            - **🔗 الرابط المباشر للأحدث (GitHub Release):**
              https://github.com/${{ github.repository }}/releases/latest/download/kAM-Lite.apk
            - **🔒 بصمة الملف الحالية (SHA-256):** `${{ env.APK_SHA256 }}`
          draft: false
          prerelease: false
          files: |
            releases/kAM-Lite.apk
            releases/version.json
            releases/delta-sync.json

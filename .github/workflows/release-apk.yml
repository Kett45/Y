name: Auto-Build & Sync Android APK + Delta Manifest

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      requires_full_install:
        description: "Require full APK install for major structural update (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build-and-sync-release:
    name: Build Latest APK & Update Single Auto-Sync Link
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Unified Signing Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Compute Version & Build Signed APK + Auto-Sync Single Link
        env:
          REPO_SLUG: ${{ github.repository }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          BASE_VERSION_NAME=$(grep -oP 'propVersionName\s*=.*"\K[^"]+' app/build.gradle.kts || echo "1.6")
          BASE_VERSION_CODE=$(grep -oP 'propVersionCode\s*=.*:\s*\K[0-9]+' app/build.gradle.kts || echo "6")
          VERSION_CODE=$((BASE_VERSION_CODE + RUN_NUM))
          VERSION_NAME="${BASE_VERSION_NAME}.${RUN_NUM}"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

          gradle :app:assembleDebug :app:syncReleaseApk \
            -PGITHUB_REPO="${REPO_SLUG}" \
            -PAPP_VERSION_CODE="${VERSION_CODE}" \
            -PAPP_VERSION_NAME="${VERSION_NAME}" \
            --no-daemon

          ls -lh releases/kAM-Lite.apk releases/version.json releases/delta-sync.json

      - name: Commit Updated APK & Manifests to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/version.json releases/delta-sync.json releases/kAM-Lite.apk README.md
          git diff --staged --quiet || git commit -m "chore(release): auto-sync APK & delta manifest v${VERSION_NAME} [skip ci]"
          git push || true

      - name: Publish or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "نجم الكارت v${{ env.VERSION_NAME }} - أحدث نسخة للأندرويد (APK)"
          body: |
            ## 📲 تحميل تطبيق نجم الكارت v${{ env.VERSION_NAME }} للأندرويد
            - **🔗 الرابط الوحيد الدائم للتحميل المباشر (يتحدث تلقائياً مع كل إصدار):**
              https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/releases/kAM-Lite.apk
          draft: false
          prerelease: false
          files: |
            releases/kAM-Lite.apk
            releases/version.json
            releases/delta-sync.json
